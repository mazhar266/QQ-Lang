[package]
name = "qql"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Quran Query Language — parse compact references to Islamic texts and resolve them against local JSON data"
license = "GPL-3.0-or-later"
repository = "https://github.com/mazhar266/QQ-Lang"
readme = "README.md"
keywords = ["quran", "hadith", "query", "parser"]
categories = ["parser-implementations", "text-processing"]
# With `fulltext` on there are two binaries; without this, `cargo run` refuses
# to pick one.
default-run = "qql"

[lib]
# `rlib` for Rust consumers and the test harness; `cdylib` and `staticlib`
# for the C ABI in src/ffi.rs.
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
# Vector similarity search: the `` `term` `` form. Off by default so the core
# stays two dependencies and no vector assets are needed to build or run.
vector = []
# Ranked full-text search: the `?"term"` form. Pulls in tantivy, which is a
# large dependency tree — hence a feature, and hence off by default.
fulltext = ["dep:tantivy"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = { version = "0.22", optional = true }

[[bin]]
name = "qql"
path = "src/bin/qql.rs"

# Builds the tantivy indexes the `fulltext` feature reads.
[[bin]]
name = "qql-index"
path = "src/bin/qql_index.rs"
required-features = ["fulltext"]
