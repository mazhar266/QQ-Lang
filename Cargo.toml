[package]
name = "qql"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Quran Query Language — parse compact references to Islamic texts and resolve them against local JSON data"
license = "GPL-3.0-or-later"
repository = "https://github.com/mazhar266/qql"
readme = "README.md"
keywords = ["quran", "hadith", "query", "parser"]
categories = ["parser-implementations", "text-processing"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "qql"
path = "src/bin/qql.rs"
