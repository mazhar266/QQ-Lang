name: Release

# Cut a release by pushing a version tag from a green main:
#
#     git tag v3.0.0 && git push origin v3.0.0
#
# Each job builds the CLI and libraries with both search features, stages a
# self-contained bundle (binaries + libqql + header + the data the resolvers
# read, indexes included), smoke-tests that bundle against its own data, and
# uploads it to the GitHub release for the tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: x86_64-linux,   archive: tar }
          - { os: macos-latest,   name: aarch64-macos,  archive: tar }
          # Intel macOS: GitHub retired macos-13 in Dec 2025; macos-15-intel is
          # the remaining free Intel label (supported into 2027). If this row
          # ever hangs at "Waiting for a runner", the label has died too —
          # delete the row rather than hunting for a successor.
          - { os: macos-15-intel, name: x86_64-macos,   archive: tar }
          - { os: windows-latest, name: x86_64-windows, archive: zip }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The tag is the single source of truth for the version: v3.1.0 stamps
      # 3.1.0 into Cargo.toml before the build, so the binary reports it and
      # Cargo.toml never needs a bump commit first. A malformed tag produces a
      # bad semver and cargo refuses loudly. (python3: portable in-place edit;
      # BSD and GNU sed disagree about -i.)
      - name: Version from tag
        run: |
          python3 - "$GITHUB_REF_NAME" <<'EOF'
          import pathlib, re, sys
          version = sys.argv[1].removeprefix("v")
          p = pathlib.Path("Cargo.toml")
          text, n = re.subn(r'^version = ".*"$', f'version = "{version}"',
                            p.read_text(), count=1, flags=re.M)
          assert n == 1, "no version line found"
          p.write_text(text)
          print("building as", version)
          EOF

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --features vector,fulltext

      # Stages dist/<name>/ and smoke-tests the staged binary against the
      # staged data — a bundle that cannot answer Q:1:1 never ships.
      - name: Package
        run: scripts/package.sh "qql-${GITHUB_REF_NAME}-${{ matrix.name }}"

      # The stamp must have reached the binary — a bundle claiming the wrong
      # version never ships.
      - name: Binary reports the tag version
        run: |
          bundle="dist/qql-${GITHUB_REF_NAME}-${{ matrix.name }}"
          bin="$bundle/qql"; [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version | grep -F "${GITHUB_REF_NAME#v}"

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar'
        run: |
          cd dist
          tar czf "qql-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz" \
                  "qql-${GITHUB_REF_NAME}-${{ matrix.name }}"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        run: |
          cd dist
          7z a -bso0 "qql-${GITHUB_REF_NAME}-${{ matrix.name }}.zip" \
                     "qql-${GITHUB_REF_NAME}-${{ matrix.name }}"

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
